<script type="module">
  import { lang } from "../i18n.js";
  const grid = document.querySelector(".ktui-springboard-links");
  const name = (tile) => tile.querySelector(".ktui-card-name").textContent.trim();
  [...grid.children]
    .sort((a, b) => name(a).localeCompare(name(b), lang))
    .forEach((tile) => grid.append(tile));
</script>
