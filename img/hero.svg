<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Blue Archive blue abstract — Homepage</title>
  <desc id="desc">A pink rectangular halo inspired by Tendo Kei over a sky-blue diagonal gradient with a light band and a violet wedge, inspired by Blue Archive.</desc>
  <defs>
    <!-- Mirrors the .ktui-home wallpaper in styles.css: a diagonal base
         gradient, a soft light band, and a hard-edged violet wedge. -->
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="429" y1="-156" x2="771" y2="786">
      <stop stop-color="#9be8f8"/>
      <stop offset=".5" stop-color="#48bdf1"/>
      <stop offset="1" stop-color="#779ff1"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="372" y1="-173" x2="828" y2="803">
      <stop offset=".38" stop-color="#eafaff" stop-opacity="0"/>
      <stop offset=".38" stop-color="#eafaff" stop-opacity=".3"/>
      <stop offset=".58" stop-color="#eafaff" stop-opacity=".3"/>
      <stop offset=".58" stop-color="#eafaff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wedge" gradientUnits="userSpaceOnUse" x1="314" y1="811" x2="886" y2="-181">
      <stop offset=".52" stop-color="#b5cfff" stop-opacity="0"/>
      <stop offset=".52" stop-color="#b5cfff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#779ff1" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".48" stop-color="#e6fcff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#8de5f8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keiHalo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef8fbe"/>
      <stop offset="100%" stop-color="#ffe0ef"/>
    </linearGradient>
    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="haloBloom" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#band)"/>
  <rect width="1200" height="630" fill="url(#wedge)"/>
  <circle cx="600" cy="315" r="390" fill="url(#halo)" opacity=".6"/>
  <!-- Vector contours traced from the supplied HALO_ケイ.png reference. -->
