<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Blue Archive blue abstract — katagaki's Homepage</title>
  <desc id="desc">An abstract composition of intersecting paths and a pink rectangular halo inspired by Tendo Kei in a bright sky-blue palette, inspired by Blue Archive.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eafaff"/>
      <stop offset=".48" stop-color="#9be8f8"/>
      <stop offset="1" stop-color="#48bdf1"/>
    </linearGradient>
    <linearGradient id="blueRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#43d9ef"/>
      <stop offset=".52" stop-color="#20aeea"/>
      <stop offset="1" stop-color="#2878dc"/>
    </linearGradient>
    <linearGradient id="cyanRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a4f5f5"/>
      <stop offset="1" stop-color="#50d6ec"/>
    </linearGradient>
    <linearGradient id="violetRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b5cfff"/>
      <stop offset="1" stop-color="#779ff1"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".48" stop-color="#e6fcff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#8de5f8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keiHalo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef8fbe"/>
      <stop offset="100%" stop-color="#ffe0ef"/>
    </linearGradient>
    <linearGradient id="bottomLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity=".30"/>
    </linearGradient>
    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="haloBloom" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="600" cy="315" r="390" fill="url(#halo)"/>
  <path d="M-100 80L200-100l1100 720-300 180z" fill="url(#blueRibbon)" opacity=".96"/>
  <path d="M60 630L580-40l150 112L210 700z" fill="url(#cyanRibbon)" opacity=".94"/>
  <path d="M490 630L990-50l210 155-385 525z" fill="url(#violetRibbon)" opacity=".84"/>
